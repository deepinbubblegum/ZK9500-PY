[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk9500"
version = "0.0.1"
description = "A Python library for ZKTeco 9500 fingerprint scanner (Unofficial)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow==12.2.0",
    "pyusb==1.3.1"
]

[project.urls]
"Homepage" = "https://github.com/deepinbubblegum/PYZK9500"