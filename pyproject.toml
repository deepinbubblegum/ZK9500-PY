[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zk9500"
version = "0.1.0"
description = "A Python library for ZKTeco 9500 fingerprint scanner"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow==12.2.0",
    "pyusb==1.3.1"
]

[project.urls]
"Homepage" = "https://github.com/deepinbubblegum/PYZK9500" # เปลี่ยนเป็น URL โปรเจกต์คุณได้ (ถ้ามี)